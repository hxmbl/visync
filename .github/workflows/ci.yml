name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dependencies come from the committed uv.lock so a new typer/rich release
# cannot break CI without a diff on your side. uv is used here only to install
# reproducibly; pip remains a perfectly good way to install visync itself.
env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run ruff check
        run: uvx --from "ruff>=0.16" ruff check .

  format:
    name: Format check (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run ruff format --check
        run: uvx --from "ruff>=0.16" ruff format --check .

  typecheck:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and pyright
        run: uv sync --locked --python 3.12 --extra dev
      - name: Run pyright
        run: uv run pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')"

  test:
    name: Test (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev tools
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev
      - name: Run tests with coverage
        # -p ci_no_ventoy_drive stubs drive detection to [] so the suite runs
        # against the machine CI actually has: no Ventoy stick plugged in. It
        # catches tests that pass only because the maintainer's hardware happens
        # to be attached, which is otherwise invisible until someone else's CI
        # goes red. Not enabled for local runs, where the hardware tests still
        # have something to talk to.
        run: uv run pytest -p ci_no_ventoy_drive
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Build & verify wheel is self-contained
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build wheel and sdist
        run: uv build
      - name: Install wheel in a clean venv and verify the packaged config
        run: |
          set -euo pipefail
          uv venv /tmp/smoke --python 3.12
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/visync version
          /tmp/smoke/bin/visync --help
          # `visync --help` passes even when config.toml is missing from the
          # wheel, which is how a broken install shipped unnoticed. Assert the
          # packaged config actually resolves, from a directory that has no
          # config.toml of its own.
          cd /tmp
          /tmp/smoke/bin/visync search > search.out
          cat search.out
          grep -q "Arch Linux" search.out
          echo "packaged config resolved OK"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  security:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
