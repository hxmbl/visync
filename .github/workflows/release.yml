name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_FROZEN: "1"

jobs:
  release:
    name: Full suite, build, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev tools
        run: uv sync --locked --python 3.12 --extra dev
      - name: Run ruff check
        run: uv run ruff check .
      - name: Run ruff format --check
        run: uv run ruff format --check .
      - name: Run pyright
        run: uv run pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')"
      - name: Run tests with coverage
        run: uv run pytest
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Build wheel and sdist
        run: uv build
      - name: Verify the wheel is self-contained
        run: |
          set -euo pipefail
          uv venv /tmp/smoke --python 3.12
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          /tmp/smoke/bin/visync version
          cd /tmp
          /tmp/smoke/bin/visync search > search.out
          cat search.out
          grep -q "Arch Linux" search.out
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --generate-notes --title "${GITHUB_REF_NAME}"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
