[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visync"
version = "0.1.0"
description = "Ventoy ISO Synchronization Tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hxmbl" }]
keywords = ["ventoy", "iso", "linux", "usb", "package-manager", "checksum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]

[project.scripts]
visync = "visync.main:app"

[project.urls]
Homepage = "https://github.com/hxmbl/visync"
Repository = "https://github.com/hxmbl/visync"
Issues = "https://github.com/hxmbl/visync/issues"

[tool.hatch.build.targets.wheel]
packages = ["visync"]

# config.toml lives at the repo root so `pip install -e .` and a source
# checkout can read it, and is copied into the wheel as visync/config.toml so an
# installed visync finds it beside its own modules. Both layouts resolve through
# finder._config_candidates(); keep the two in sync.
[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "visync/config.toml"

[tool.hatch.build.targets.sdist]
include = [
    "/visync",
    "/test",
    "/config.toml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",  # typer.Option(...) default arguments are the CLI idiom
    "BLE001",  # deliberate network/disk-tolerant exception handling
    "S110",  # intentional except-pass while probing connectivity/disk edge cases
    "S112",  # intentional ignore + manual returncode handling
    "PLW1510",  # subprocess without check=True; returncode checked explicitly
]

[tool.pyright]
include = ["visync"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=src --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70"