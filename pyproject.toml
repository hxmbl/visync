[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visync"
version = "0.1.0"
description = "Ventoy ISO Synchronization Tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hxmbl" }]
keywords = ["ventoy", "iso", "linux", "usb", "package-manager", "checksum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]

[project.scripts]
visync = "visync.main:app"

[project.urls]
Homepage = "https://github.com/hxmbl/visync"
Repository = "https://github.com/hxmbl/visync"
Issues = "https://github.com/hxmbl/visync/issues"

[tool.hatch.build.targets.wheel]
packages = ["visync"]

# config.toml lives at the repo root so `pip install -e .` and a source
# checkout can read it, and is copied into the wheel as visync/config.toml so an
# installed visync finds it beside its own modules. Both layouts resolve through
# finder._config_candidates(); keep the two in sync.
[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "visync/config.toml"

[tool.hatch.build.targets.sdist]
include = [
    "/visync",
    "/test",
    "/config.toml",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# S (bandit) and B (bugbear) are the security-relevant families and are enabled
# here. They previously sat in `ignore` without ever being selected, so the
# rules were dead config and nothing was actually being checked.
select = ["F", "I", "UP", "B", "S"]
#
# These ignores are project-wide policies, each true of every remaining site.
# Anything that needs a per-site argument (a swallowed exception with a specific
# reason, say) carries a per-line `# noqa` instead, so a global ignore here
# always means "the same thing everywhere", never "we stopped looking".
ignore = [
    "B008",  # typer.Option(...) in argument defaults is the CLI idiom
    "S101",  # assert is used in tests only
    "S108",  # hardcoded /tmp paths in tests are never read or written
    "S324",  # sha1 is a supported checksum_algo, exercised deliberately
    # Every subprocess call passes a literal argv list with no shell=True and no
    # interpolated user input, so S603 cannot fire on a real injection here.
    "S603",
    # "gpg", "mount", "udisksctl" and "blkid" are resolved through PATH on
    # purpose, so a distro-packaged binary works without hardcoding a prefix.
    "S607",
    # Every urlopen call site is preceded by require_https(), which is the
    # explicit scheme allowlist S310 asks for. Pinned by TestLoopbackExemption.
    "S310",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures probe hardware and swallow failures by design; there is no
# logging channel for a fixture to report through.
"test/*" = ["S110", "S112", "S301"]

[tool.pyright]
include = ["visync"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["test"]
# --cov=src was left behind by the src/ -> visync/ rename. It matched no
# module, so coverage measured 0% while every test passed and CI failed
# on a green run.
addopts = "--cov=visync --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70"