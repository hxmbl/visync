#!/visync/config.toml
[iso]
source_dir = ""
download_dir = ""
# ^ We don't download straight to the ventoy drive as its faster to verify and acts as a buffer. --no-buffer flag can override this, but verify will still happen, just on the drive.

[checksums]
enabled = true



###################################
####### DISTRO RECOGNITION ########
###################################
[base_distros]
# Strict internal volume ID matches
arch = "Arch Linux"
fedora = "Fedora"
ubuntu = "Ubuntu"
debian = "Debian"

[fork_overrides]
# Key format: "parent_distro.keyword_in_filename" = "Clean Name"
"arch.omarchy" = "Omarchy"
"arch.manjaro" = "Manjaro"
"ubuntu.pop-os" = "Pop!_OS"
"ubuntu.pop_os" = "Pop!_OS"
"ubuntu.mint" = "Linux Mint"
"debian.kali" = "Kali Linux"
"debian.parrot" = "Parrot Security"
# Fedora's aarch64 images carry "Fedora" in the volume ID, so without this they
# are indistinguishable from x86_64 and install/remove cannot target one.
"fedora.aarch64" = "Fedora ARM"

[standalone_matches]
# Text matching targets for standalone distros, flavors, and tools
gparted = "GParted Live"
hbcd = "Hiren's BootCD"
hiren = "Hiren's BootCD"
kodachi = "Linux Kodachi"
nixos-minimal = "NixOS Minimal"
nixos-graphical = "NixOS Graphical"
nixos = "NixOS Minimal"
parrot = "Parrot Security"
pop = "Pop!_OS"
systemrescue = "SystemRescue"
rescuezilla = "Rescuezilla"
tails = "Tails"
tiny11 = "Tiny11"

# Specific desktop flavor/version overrides so regex doesn't grab them poorly.
# These must mirror the [distros.*] clean_name exactly: install/remove match an
# identified distro against clean_name, so a missing entry here makes a
# configured distro impossible to remove (test_verify_consistency_enforces this).
fedora-kde = "Fedora KDE"
fedora-arm = "Fedora ARM"
ubuntu-desktop = "Ubuntu Desktop"
ubuntu-server = "Ubuntu Server"

###################################
######## DYNAMIC SCRAPERS #########
###################################
#
[distros.Fedora]
clean_name = "Fedora"
keyword = "fedora"
strategy = "fedora_nested"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
version_regex = 'href="([0-9]+)\s*/"'
iso_regex = 'href="(Fedora-Workstation-Live-(?:x86_64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.x86_64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
# Release-signing keys from https://fedoraproject.org/fedora.gpg (refresh when
# Fedora publishes new keys). Matches VALIDSIG fingerprints via --status-fd.
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

[distros.ArchLinux]
clean_name = "Arch Linux"
keyword = "archlinux"
strategy = "direct_match"
base_url = "https://geo.mirror.pkgbuild.com/iso/latest/"
iso_regex = 'href="(archlinux-[0-9\.]+-x86_64\.iso)"'
checksum_url = "{base_url}sha256sums.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.UbuntuServer]
clean_name = "Ubuntu Server"
keyword = "live-server"
strategy = "ubuntu_nested"
base_url = "https://releases.ubuntu.com/"
version_regex = 'href="([0-9\.]+)/"'
# Current Ubuntu LTS only — see UbuntuDesktop for the rationale.
version_filter = '\d*[02468]\.04(\.\d+)*'
iso_regex = 'href="(ubuntu-[0-9\.-]+live-server-amd64\.iso)"'
checksum_url = "{base_url}{version}/SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

################
##### ARM ######
################

[distros.FedoraARM]
clean_name = "Fedora ARM"
keyword = "fedora-arm"
strategy = "fedora_nested"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
variant_path = "Workstation/aarch64/iso"
version_regex = 'href="([0-9]+\s*/)"'
# Fedora ships Workstation aarch64 lives under the standard variant subtree
iso_regex = 'href="(Fedora-Workstation-Live-(?:aarch64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.aarch64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

# NOTE: Arch Linux ARM was removed. os.archlinuxarm.org serves a TLS
# certificate that does not match its hostname (scraping fails closed), and
# its artifacts are per-device .tar.gz rootfs archives — not .iso/.img files
# Ventoy can boot or visync can track. Re-add here if upstream publishes a
# bootable image over a valid certificate.

#############################
###### ADDITIONAL DT #######
#############################

[distros.FedoraKDE]
clean_name = "Fedora KDE"
keyword = "fedora-kde"
strategy = "fedora_nested"
variant_path = "KDE/x86_64/iso"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
version_regex = 'href="([0-9]+\s*/)"'
iso_regex = 'href="(Fedora-KDE-Desktop-Live-(?:x86_64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.x86_64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

[distros.UbuntuDesktop]
clean_name = "Ubuntu Desktop"
keyword = "desktop"
strategy = "ubuntu_nested"
base_url = "https://releases.ubuntu.com/"
version_regex = 'href="([0-9\.]+)/"'
# Track the current Ubuntu LTS rather than the newest release of any kind.
# LTS is an even-numbered year with a .04 month; interim releases (26.10,
# 25.10, ...) are excluded. Point releases like 26.04.1 also match, which is
# what we want — those are the same LTS series.
version_filter = '\d*[02468]\.04(\.\d+)*'
iso_regex = 'href="(ubuntu-[0-9\.-]+desktop-amd64\.iso)"'
checksum_url = "{base_url}{version}/SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.ParrotSecurity]
clean_name = "Parrot Security"
keyword = "parrot"
strategy = "ubuntu_nested"
base_url = "https://deb.parrotsec.org/parrot/iso/"
version_regex = 'href="([0-9\.]+(?:-[0-9]+)?)/"'
iso_regex = 'href="(Parrot-security-[0-9\.]+_amd64\.iso)"'
# signed-hashes.txt is one clearsigned file listing md5, sha256 and sha512
# sections for every image. The parser selects the sha256 section by header
# and digest length — taking the first match would compare an md5 against a
# sha256 and delete a good download as "corrupt".
checksum_url = "{base_url}{version}/signed-hashes.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"
# Signing key published by Parrot and referenced from inside the signed
# content itself. Fingerprint confirmed via gpg --verify (VALIDSIG) against
# the untouched file, and matches the fingerprint in Parrot's own
# hash-and-key-verification documentation.
signing_key_url = "https://deb.parrot.sh/parrot/misc/archive.gpg"
signing_key_fingerprint = [
    "B711822346552E4D92DA02DF7A8286AF0E81EE4A",
]

[distros.NixOS]
clean_name = "NixOS Minimal"
keyword = "nixos-minimal"
strategy = "nixos_channel"
# base_url is a prefix: the current stable channel (e.g. 26.05) is appended,
# giving https://channels.nixos.org/nixos-26.05, which redirects to the exact
# releases.nixos.org directory. NixOS publishes no nixos-stable alias, so the
# channel is resolved from the release bucket at scrape time — see
# nixos_channel in src/download.py.
base_url = "https://channels.nixos.org/nixos"
# Optional pin. If set and still a real channel it wins; otherwise the newest
# stable channel from the bucket is used. Omit to always track latest stable.
# channel = "26.05"
variant = "minimal"
# ISOs and .sha256 sidecars live under releases.nixos.org, NOT the channel host
# (channels.nixos.org serves no .sha256, which made `visync verify` fail with
# "source unreachable" for every NixOS ISO).
releases_base_url = "https://releases.nixos.org"
# Sidecars sit at /nixos/<channel>/nixos-<full release>/<iso>.sha256
checksum_url = "{release_base_url}/nixos/{version}/nixos-{release}/{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.NixOSGraphical]
clean_name = "NixOS Graphical"
keyword = "nixos-graphical"
strategy = "nixos_channel"
base_url = "https://channels.nixos.org/nixos"
variant = "graphical"
releases_base_url = "https://releases.nixos.org"
checksum_url = "{release_base_url}/nixos/{version}/nixos-{release}/{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

# NOTE: Omarchy was removed. https://iso.omarchy.org/ returns HTTP 404 for
# every path tried, including /index.html and /latest/. The per-version ISOs
# still exist (e.g. /omarchy-4.0.1.iso serves a 6 GB file) but there is no
# index page for direct_match to scrape, and no JSON manifest or release feed
# was found to replace it. Guessing a version would mean trusting an
# unverifiable pointer, so the scraper would fail closed instead.
# Re-add here if Omarchy publishes a browsable index or a machine-readable
# release feed.

[distros.PopOS]
clean_name = "Pop!_OS"
keyword = "pop"
strategy = "popos_api"
api_url = "https://api.pop-os.org/builds"
variant = "generic"
release = "24.04"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.Tails]
clean_name = "Tails"
keyword = "tails"
strategy = "tails_api"
api_url = "https://tails.net/install/v2/Tails/amd64/stable/latest.json"
file_type = "img"
checksum_format = "sha256sums"
checksum_algo = "sha256"
