#!/visync/config.toml
[iso]
download_dir = ""
# ^ We don't download straight to the ventoy drive as its faster to verify and acts as a buffer. --no-buffer flag can override this, but verify will still happen, just on the drive.

[checksums]
enabled = true



###################################
####### DISTRO RECOGNITION ########
###################################
[base_distros]
# Strict internal volume ID matches
arch = "Arch Linux"
fedora = "Fedora"
ubuntu = "Ubuntu"
debian = "Debian"
# CachyOS ISOs carry the abbreviated volume ID "COS_260809".
cos = "CachyOS Desktop"

[fork_overrides]
# Key format: "parent_distro.keyword_in_filename" = "Clean Name"
"arch.manjaro" = "Manjaro"
"ubuntu.pop-os" = "Pop!_OS"
"ubuntu.pop_os" = "Pop!_OS"
"ubuntu.mint" = "Linux Mint"
"debian.kali" = "Kali Linux"
"debian.parrot" = "Parrot Security"
# Fedora's aarch64 images carry "Fedora" in the volume ID, so without this they
# are indistinguishable from x86_64 and install/remove cannot target one.
"fedora.aarch64" = "Fedora ARM"

[standalone_matches]
# Text matching targets for standalone distros, flavors, and tools
cachyos = "CachyOS Desktop"
# elementary OS writes "elementary OS" to the volume ID but prefixes its
# filenames with "elementaryos-", so both spellings must identify one distro.
elementary = "elementary OS"
elementaryos = "elementary OS"
gparted = "GParted Live"
hbcd = "Hiren's BootCD"
hiren = "Hiren's BootCD"
kodachi = "Linux Kodachi"
# Mint ISOs are prefixed "linuxmint-", which normalises to a single "linuxmint"
# token, so the "ubuntu.mint" fork override can never see a standalone "mint"
# token in the filename. Match the prefix directly or install/remove cannot
# target a downloaded Mint image.
linuxmint = "Linux Mint"
nixos-minimal = "NixOS Minimal"
nixos-graphical = "NixOS Graphical"
nixos = "NixOS Minimal"
# Tumbleweed ISOs are filed as "openSUSE-Tumbleweed-…", which produces a single
# "opensuse" filename token and no volume ID match, so match the prefix directly
# or install/remove cannot target a downloaded Tumbleweed image.
opensuse = "openSUSE Tumbleweed"
# EndeavourOS ISO filenames use the EndeavourOS_ prefix and are not identified
# reliably by their volume ID on every release, so match the filename directly.
endeavouros = "EndeavourOS"
# Leap ISOs are filed as "Leap-16.1-offline-installer-x86_64.install.iso", which
# produces a "leap" filename token. Match the prefix directly or install/remove
# cannot target a downloaded Leap image.
leap = "openSUSE Leap"
parrot = "Parrot Security"
pond = "Pond"
pop = "Pop!_OS"
systemrescue = "SystemRescue"
rescuezilla = "Rescuezilla"
tails = "Tails"
tiny11 = "Tiny11"
# Zorin ISOs write "Zorin OS 18.1 Core 64bit" to the volume ID and prefix their
# filenames with "Zorin-OS-", so the "zorin" keyword hits both. There is no
# Ubuntu fork override here: Zorin's volume ID contains no "ubuntu" token, so
# base_distros cannot see it at all.
zorin = "Zorin OS"

# Specific desktop flavor/version overrides so regex doesn't grab them poorly.
# These must mirror the [distros.*] clean_name exactly: install/remove match an
# identified distro against clean_name, so a missing entry here makes a
# configured distro impossible to remove (test_verify_consistency_enforces this).
fedora-kde = "Fedora KDE"
fedora-arm = "Fedora ARM"
opensuse-leap = "openSUSE Leap"
ubuntu-desktop = "Ubuntu Desktop"
ubuntu-server = "Ubuntu Server"

###################################
######## DYNAMIC SCRAPERS #########
###################################
#
[distros.Fedora]
clean_name = "Fedora"
keyword = "fedora"
strategy = "fedora_nested"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
version_regex = 'href="([0-9]+)\s*/"'
iso_regex = 'href="(Fedora-Workstation-Live-(?:x86_64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.x86_64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
# Release-signing keys from https://fedoraproject.org/fedora.gpg (refresh when
# Fedora publishes new keys). Matches VALIDSIG fingerprints via --status-fd.
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

[distros.ArchLinux]
clean_name = "Arch Linux"
keyword = "archlinux"
strategy = "direct_match"
base_url = "https://geo.mirror.pkgbuild.com/iso/latest/"
iso_regex = 'href="(archlinux-[0-9\.]+-x86_64\.iso)"'
checksum_url = "{base_url}sha256sums.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.UbuntuServer]
clean_name = "Ubuntu Server"
keyword = "live-server"
strategy = "ubuntu_nested"
base_url = "https://releases.ubuntu.com/"
version_regex = 'href="([0-9\.]+)/"'
# Current Ubuntu LTS only — see UbuntuDesktop for the rationale.
version_filter = '\d*[02468]\.04(\.\d+)*'
iso_regex = 'href="(ubuntu-[0-9\.-]+live-server-amd64\.iso)"'
checksum_url = "{base_url}{version}/SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

################
##### ARM ######
################

[distros.FedoraARM]
clean_name = "Fedora ARM"
keyword = "fedora-arm"
strategy = "fedora_nested"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
variant_path = "Workstation/aarch64/iso"
version_regex = 'href="([0-9]+\s*/)"'
# Fedora ships Workstation aarch64 lives under the standard variant subtree
iso_regex = 'href="(Fedora-Workstation-Live-(?:aarch64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.aarch64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

# NOTE: Arch Linux ARM was removed. os.archlinuxarm.org serves a TLS
# certificate that does not match its hostname (scraping fails closed), and
# its artifacts are per-device .tar.gz rootfs archives — not .iso/.img files
# Ventoy can boot or visync can track. Re-add here if upstream publishes a
# bootable image over a valid certificate.

#############################
###### ADDITIONAL DT #######
#############################

[distros.FedoraKDE]
clean_name = "Fedora KDE"
keyword = "fedora-kde"
strategy = "fedora_nested"
variant_path = "KDE/x86_64/iso"
# dl.fedoraproject.org serves an Anubis bot challenge to scrapers; kernel.org
# mirrors the same tree bot-free. Integrity is pinned via signing_key_fingerprint.
base_url = "https://mirrors.kernel.org/fedora/releases/"
version_regex = 'href="([0-9]+\s*/)"'
iso_regex = 'href="(Fedora-KDE-Desktop-Live-(?:x86_64-[0-9][0-9.\-]*\.iso|[0-9][0-9.\-]*\.x86_64\.iso))"'
checksum_url = "{base_url}{version}/{variant_dir}/{arch}/iso/{checksum_stem}-CHECKSUM"
checksum_format = "gpg_checksum"
signing_key_url = "https://fedoraproject.org/fedora.gpg"
signing_key_fingerprint = [
    "C6E7F081CF80E13146676E88829B606631645531",
    "36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6",
    "4F50A6114CD5C6976A7F1179655A4B02F577861E",
    "D924B10D3E810DABDD8B56B596E7E91491211FCE",
]

[distros.UbuntuDesktop]
clean_name = "Ubuntu Desktop"
keyword = "desktop"
strategy = "ubuntu_nested"
base_url = "https://releases.ubuntu.com/"
version_regex = 'href="([0-9\.]+)/"'
# Track the current Ubuntu LTS rather than the newest release of any kind.
# LTS is an even-numbered year with a .04 month; interim releases (26.10,
# 25.10, ...) are excluded. Point releases like 26.04.1 also match, which is
# what we want — those are the same LTS series.
version_filter = '\d*[02468]\.04(\.\d+)*'
iso_regex = 'href="(ubuntu-[0-9\.-]+desktop-amd64\.iso)"'
checksum_url = "{base_url}{version}/SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.LinuxMint]
clean_name = "Linux Mint"
keyword = "mint"
strategy = "ubuntu_nested"
# kernel.org mirrors linuxmint/stable (same bot-free mirror tree Fedora's
# releases use). The index holds numbered release dirs (22.1/, 22.2/, ...),
# each containing the edition ISOs and sha256sum.txt next to them.
base_url = "https://mirrors.kernel.org/linuxmint/stable/"
version_regex = 'href="([0-9\.]+)/"'
# Edition selection: pin the flagship Cinnamon image. Mate and Xfce share the
# same release directory and the resolver takes the first iso_regex match, so
# an unpinned pattern would depend on directory listing order.
iso_regex = 'href="(linuxmint-[0-9\.]+-cinnamon-64bit\.iso)"'
# {version} is parsed from the ISO filename ("22.1" in
# linuxmint-22.1-cinnamon-64bit.iso), which is also the release dir name.
checksum_url = "{base_url}{version}/sha256sum.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.ParrotSecurity]
clean_name = "Parrot Security"
keyword = "parrot"
strategy = "ubuntu_nested"
base_url = "https://deb.parrotsec.org/parrot/iso/"
version_regex = 'href="([0-9\.]+(?:-[0-9]+)?)/"'
iso_regex = 'href="(Parrot-security-[0-9\.]+_amd64\.iso)"'
# signed-hashes.txt is one clearsigned file listing md5, sha256 and sha512
# sections for every image. The parser selects the sha256 section by header
# and digest length — taking the first match would compare an md5 against a
# sha256 and delete a good download as "corrupt".
checksum_url = "{base_url}{version}/signed-hashes.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"
# Signing key published by Parrot and referenced from inside the signed
# content itself. Fingerprint confirmed via gpg --verify (VALIDSIG) against
# the untouched file, and matches the fingerprint in Parrot's own
# hash-and-key-verification documentation.
signing_key_url = "https://deb.parrot.sh/parrot/misc/archive.gpg"
signing_key_fingerprint = [
    "B711822346552E4D92DA02DF7A8286AF0E81EE4A",
]

[distros.CachyOS]
clean_name = "CachyOS Desktop"
keyword = "cachyos"
strategy = "ubuntu_nested"
base_url = "https://mirror.cachyos.org/ISO/desktop/"
# Release directories are date-numbered YYMMDD (260426/, 260628/, 260809/).
version_regex = 'href="([0-9]{6})/"'
# The release directory holds one desktop ISO alongside .sha1, .sha256,
# .sig and .pkgs.txt sidecars. The trailing quote keeps the sidecars out.
iso_regex = 'href="(cachyos-desktop-linux-[0-9]{6}\.iso)"'
# The .iso.sha256 sidecar is a standard "<digest>  <filename>" line.
checksum_url = "{base_url}{version}/{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.NixOS]
clean_name = "NixOS Minimal"
keyword = "nixos-minimal"
strategy = "nixos_channel"
# base_url is a prefix: the current stable channel (e.g. 26.05) is appended,
# giving https://channels.nixos.org/nixos-26.05, which redirects to the exact
# releases.nixos.org directory. NixOS publishes no nixos-stable alias, so the
# channel is resolved from the release bucket at scrape time — see
# nixos_channel in src/download.py.
base_url = "https://channels.nixos.org/nixos"
# Optional pin. If set and still a real channel it wins; otherwise the newest
# stable channel from the bucket is used. Omit to always track latest stable.
# channel = "26.05"
variant = "minimal"
# ISOs and .sha256 sidecars live under releases.nixos.org, NOT the channel host
# (channels.nixos.org serves no .sha256, which made `visync verify` fail with
# "source unreachable" for every NixOS ISO).
releases_base_url = "https://releases.nixos.org"
# Sidecars sit at /nixos/<channel>/nixos-<full release>/<iso>.sha256
checksum_url = "{release_base_url}/nixos/{version}/nixos-{release}/{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.NixOSGraphical]
clean_name = "NixOS Graphical"
keyword = "nixos-graphical"
strategy = "nixos_channel"
base_url = "https://channels.nixos.org/nixos"
variant = "graphical"
releases_base_url = "https://releases.nixos.org"
checksum_url = "{release_base_url}/nixos/{version}/nixos-{release}/{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.PopOS]
clean_name = "Pop!_OS"
keyword = "pop"
strategy = "popos_api"
api_url = "https://api.pop-os.org/builds"
variant = "generic"
release = "24.04"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.Tails]
clean_name = "Tails"
keyword = "tails"
strategy = "tails_api"
api_url = "https://tails.net/install/v2/Tails/amd64/stable/latest.json"
file_type = "img"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.Pond]
clean_name = "Pond"
keyword = "pond"
strategy = "content_disposition"
base_url = "https://releases.butterfly.so/iso/"
iso_regex = '^pond-installer-([0-9]+\.[0-9]+\.[0-9]+)-x86_64\.iso$'

[distros.Kali]
clean_name = "Kali Linux"
keyword = "kali"
strategy = "direct_match"
# cdimage.kali.org/current/ is a flat index of the current release: installer
# and live ISOs sit together with SHA256SUMS. The installer filenames are
# versioned (kali-linux-2026.3-installer-amd64.iso), so match on the version and
# architecture to select the standard x86_64 installer without picking up the
# netinst/purple/everything flavors or any live image (out of scope here).
base_url = "https://cdimage.kali.org/current/"
iso_regex = 'href="(kali-linux-[0-9]+\.[0-9]+-installer-amd64\.iso)"'
checksum_url = "{base_url}SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.DebianNetinst]
clean_name = "Debian"
keyword = "debian"
strategy = "direct_match"
# cdimage.debian.org .../iso-cd/ is a flat index of the current stable amd64
# media together with SHA256SUMS. Only the standard netinst installer is in
# scope (live Debian images are not); the regex requires a digit directly after
# "debian-" so the debian-edu/debian-mac flavors cannot be picked up.
base_url = "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/"
iso_regex = 'href="(debian-[0-9]+\.[0-9]+\.[0-9]+-amd64-netinst\.iso)"'
checksum_url = "{base_url}SHA256SUMS"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.OpenSUSETumbleweedDVD]
clean_name = "openSUSE Tumbleweed"
keyword = "opensuse"
strategy = "direct_match"
# download.opensuse.org/tumbleweed/iso/ is a flat index holding dated snapshot
# media (openSUSE-Tumbleweed-DVD-x86_64-Snapshot20261103-Media.iso) next to the
# mutable "Current.iso" alias and per-file .sha256/.asc sidecars. The mutable
# alias carries a stable URL but no update signal (the bytes change underneath),
# so match the dated snapshot filename instead: its dateset change IS the update
# detection. "Snapshot" + "-Media" is part of the real filename, not decoration.
base_url = "https://download.opensuse.org/tumbleweed/iso/"
iso_regex = 'href="./?(openSUSE-Tumbleweed-DVD-x86_64-Snapshot[0-9]{8}-Media\.iso)"'
# The listing prefixes download hrefs with "./", so the regex must allow an
# optional ./ between the quote and the filename.
newest_match = true
checksum_url = "{base_url}{iso_name}.sha256"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.OpenSUSELeap]
clean_name = "openSUSE Leap"
keyword = "leap"
strategy = "fedora_nested"
# download.opensuse.org/distribution/leap/ holds version directories (15.6/, 16.1/, ...).
# Legacy 42.x directories exist, so version_filter is required to select stable releases.
base_url = "https://download.opensuse.org/distribution/leap/"
version_regex = 'href="([0-9]+\.[0-9]+)/"'
# Filter to 15.x and 16.x stable series, excluding legacy 42.x.
version_filter = '1[5-9]\.[0-9]+'
# Select the x86_64 offline installer (non-build variant for deterministic selection).
variant_path = "offline"
iso_regex = 'href="(Leap-[0-9]+\.[0-9]+-offline-installer-x86_64\.install\.iso)"'
checksum_url = "{base_url}{version}/offline/{iso_name}.sha512"
checksum_format = "sha256sums"
checksum_algo = "sha512"

[distros.EndeavourOS]
clean_name = "EndeavourOS"
keyword = "endeavouros"
strategy = "direct_match"
# The mirror index contains the rolling set of dated installer images. Select
# the newest dated x86_64 ISO and use its adjacent SHA-512 sidecar.
base_url = "https://mirror.alpix.eu/endeavouros/iso/"
iso_regex = 'href="(EndeavourOS_[A-Za-z0-9_-]+-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.iso)"'
newest_match = true
checksum_url = "{base_url}{iso_name}.sha512sum"
checksum_format = "sha256sums"
checksum_algo = "sha512"

[distros.ZorinOS]
clean_name = "Zorin OS"
keyword = "zorin"
strategy = "ubuntu_nested"
# Zorin's mirrors are listed at zorin.com/os/mirrors; the free Core edition is
# the one in scope. distro.ibiblio.org is the first official mirror and serves
# plain bot-free directory indexes. Its root holds one numeric directory per
# major release (15/, 16/, 17/, 18/) plus non-numeric dirs the version regex
# cannot match, so "newest major" falls out of the standard sort.
base_url = "https://distro.ibiblio.org/zorinos/"
version_regex = 'href="([0-9\.]+)/"'
# A release directory keeps EVERY artifact of that major release: the base
# image, -rN maintenance rebuilds (Zorin-OS-18-Core-64-bit-r3.iso, re-spun with
# no version change), beta images, and sibling editions (Lite, Education). The
# first-match rule of ubuntu_nested would resolve to whichever came first in
# the listing, so Core 64-bit is matched explicitly — the version must lead the
# edition token, which structurally excludes "…-Core-Beta-64-bit…" — and
# newest_match picks the greatest (version, revision) pair.
iso_regex = 'href="(Zorin-OS-[0-9]+(?:\.[0-9]+)?-Core-64-bit(?:-r[0-9]+)?\.iso)"'
newest_match = true
# The sums file sits in the major-release directory, not in a per-point-release
# one (releases.ubuntu.com-style 18.1/ does not exist), and it lists every
# artifact including revisions and betas. {major} is the major release number
# parsed from the ISO filename, since it stays valid whether the newest artifact
# is "18-Core…-rN" (parsed version 18.0.N) or "18.1-Core…" (18.1).
checksum_url = "{base_url}{major}/SHA256SUMS.txt"
checksum_format = "sha256sums"
checksum_algo = "sha256"

[distros.ElementaryOS]
clean_name = "elementary OS"
keyword = "elementary"
strategy = "elementary_page"
# The homepage embeds a temporary, base64-looking token in the stable amd64
# download link. The scraper reads that link fresh on every run — it must never
# be hardcoded, generated, or cached. Only dl.elementaryos.org is accepted.
base_url = "https://elementary.io/"
# The installation guide publishes the SHA-256 next to the exact ISO filename.
# A missing or ambiguous digest leaves the download UNVERIFIED; HTTPS alone is
# never treated as integrity verification.
checksum_url = "https://elementary.io/docs/installation"
checksum_format = "elementary_docs"
checksum_algo = "sha256"
